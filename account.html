<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>حساب الطالب | مِنهَاج</title><meta name="description" content="تسجيل الدخول وإدارة حساب الطالب في منصة منهاج.">
<link rel="icon" href="assets/logo.svg"><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/responsive.css">
<style>
.team-application{position:relative;overflow:hidden;margin-top:8px;padding:clamp(20px,4vw,30px);border-color:rgba(124,92,255,.22);background:linear-gradient(145deg,rgba(124,92,255,.09),var(--color-surface) 45%,rgba(32,201,216,.045));box-shadow:var(--shadow-md)}
.team-application::before{content:"";position:absolute;width:220px;height:220px;top:-150px;left:-90px;border-radius:50%;background:rgba(124,92,255,.11);pointer-events:none}
.team-application__intro{position:relative;display:flex;align-items:center;gap:16px;margin-bottom:20px}.team-application__icon{display:grid;place-items:center;flex:0 0 58px;width:58px;height:58px;border:1px solid rgba(124,92,255,.28);border-radius:18px;background:rgba(124,92,255,.13);font-size:27px;box-shadow:0 10px 28px rgba(124,92,255,.12)}.team-application__intro h2{margin:2px 0 4px;font-size:clamp(21px,4vw,29px);line-height:1.25}.team-application__intro p,.team-application__notice p,.team-application__form-head p{margin:0;color:var(--color-muted);line-height:1.75}.team-application__notice{display:flex;gap:12px;align-items:flex-start;margin-bottom:22px;padding:14px 16px;border:1px solid var(--color-border);border-radius:15px;background:rgba(255,255,255,.025)}.team-application__notice>span{font-size:20px;line-height:1.5}.team-application__notice strong{display:block;margin-bottom:2px}.team-application__form-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--color-border)}.team-application__form-head strong{font-size:18px}.team-application__count{flex:0 0 auto;padding:6px 11px;border-radius:999px;background:rgba(124,92,255,.10);border:1px solid rgba(124,92,255,.18);font-size:.78rem;font-weight:800;color:var(--color-text)}.team-application__form{display:grid;gap:12px}.team-question{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;padding:15px;border:1px solid var(--color-border);border-radius:15px;background:rgba(0,0,0,.035);transition:border-color .18s ease,background .18s ease,transform .18s ease}.team-question:focus-within{border-color:rgba(124,92,255,.42);background:rgba(124,92,255,.045)}.team-question__number{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:rgba(124,92,255,.12);border:1px solid rgba(124,92,255,.2);font-size:.8rem;font-weight:900}.team-question__body{display:grid;gap:8px;min-width:0}.team-question__body strong{font-size:15px;line-height:1.65}.team-question textarea{width:100%;min-height:108px;padding:12px 13px;border:1px solid var(--color-border);border-radius:12px;background:var(--color-surface-solid);color:var(--color-text);resize:vertical;outline:0;line-height:1.8;transition:border-color .18s ease,box-shadow .18s ease}.team-question textarea::placeholder{color:var(--color-muted);opacity:.7}.team-question textarea:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(124,92,255,.13)}.team-application__submit{display:grid;gap:9px;margin-top:5px}.team-application__submit .button{width:100%}.team-application__locked,.team-application__status{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:13px;padding:16px;border:1px solid var(--color-border);border-radius:15px;background:rgba(255,255,255,.025)}.team-application__locked>span,.team-application__status-icon{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:rgba(124,92,255,.10);font-size:19px}.team-application__locked strong,.team-application__status strong{display:block;margin-bottom:2px}.team-application__locked p,.team-application__status p{margin:0;color:var(--color-muted);font-size:.9rem;line-height:1.7}.team-application__status.is-pending{border-color:rgba(245,158,11,.28);background:rgba(245,158,11,.045)}.team-application__status.is-pending .team-application__status-icon{background:rgba(245,158,11,.12)}.team-application__status.is-approved{border-color:rgba(16,185,129,.28);background:rgba(16,185,129,.045)}.team-application__status.is-approved .team-application__status-icon{background:rgba(16,185,129,.12)}.team-application__status.is-rejected{border-color:rgba(239,68,68,.25);background:rgba(239,68,68,.04);grid-template-columns:auto 1fr}.team-application__status.is-rejected .team-application__status-icon{background:rgba(239,68,68,.10)}.team-application__status .badge{justify-self:end}.team-application__reapply{margin-top:12px}
@media(max-width:560px){.team-application__intro{align-items:flex-start}.team-application__icon{flex-basis:50px;width:50px;height:50px;border-radius:15px;font-size:23px}.team-application__notice{padding:12px}.team-application__form-head{align-items:flex-start;flex-direction:column}.team-question{grid-template-columns:30px 1fr;gap:9px;padding:12px}.team-question__number{width:30px;height:30px;border-radius:9px}.team-question textarea{min-height:118px}.team-application__locked,.team-application__status,.team-application__status.is-rejected{grid-template-columns:auto 1fr}.team-application__locked .button,.team-application__status .badge{grid-column:1 / -1;justify-self:stretch}.team-application__status .badge{text-align:center}}
</style>
</head><body data-page="account"><div id="app"></div><script src="js/config/runtime.js"></script><script type="module" src="js/pages/account.js"></script></body></html>
