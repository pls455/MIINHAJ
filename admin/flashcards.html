<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة البطاقات | مِنهَاج</title><meta name="description" content="إدارة البطاقات التعليمية."><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/responsive.css"><link rel="stylesheet" href="../css/admin.css"></head><body><header id="site-header"></header><main class="container admin-page"><section class="page-head"><span class="eyebrow">لوحة الإدارة</span><h1>إدارة البطاقات التعليمية</h1></section><section class="card"><div class="section-head"><h2>البطاقات</h2><button id="add-card" class="button primary" type="button">إضافة بطاقة</button></div><div id="status" class="message" role="status"></div><div id="card-list" class="grid"><div class="empty">جاري التحميل...</div></div><div id="pagination" class="actions"></div></section></main><footer id="site-footer"></footer><dialog id="card-dialog"><form id="card-form" class="card"><h2 id="form-title">إضافة بطاقة</h2><label>السؤال<input id="question" required maxlength="1000"></label><label>الإجابة<textarea id="answer" required maxlength="5000"></textarea></label><label>الشرح<textarea id="explanation" maxlength="5000"></textarea></label><div class="form-grid"><label>معرّف الفرع<input id="branchId" required maxlength="120"></label><label>معرّف المادة<input id="subjectId" required maxlength="120"></label></div><div class="form-grid"><label>الترتيب<input id="order" type="number" min="0" step="1" value="0" required></label><label><input id="active" type="checkbox" checked> مفعّلة</label></div><div class="actions"><button class="button primary" type="submit">حفظ</button><button class="button" id="cancel" type="button">إلغاء</button></div></form></dialog><script type="module" src="../js/admin/flashcards.js"></script></body></html>
