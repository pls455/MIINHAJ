<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الحلول | مِنهَاج</title><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/responsive.css"><link rel="stylesheet" href="../css/admin.css"></head><body><header id="site-header"></header><main class="container admin-page"><section class="page-head"><span class="eyebrow">لوحة الإدارة</span><h1>إدارة الحلول</h1></section><section class="card"><div class="section-head"><h2>الحلول</h2><button class="button primary" id="add-solution">إضافة حل</button></div><div id="solution-list" class="grid"><div class="empty">جاري التحميل...</div></div><div id="pagination" class="actions"></div></section></main><footer id="site-footer"></footer><dialog id="solution-dialog"><form id="solution-form" class="card"><h2 id="form-title">إضافة حل</h2><label>العنوان<input id="title" required maxlength="200"></label><label>الوصف<textarea id="description" maxlength="3000"></textarea></label><label>الرابط<input id="url" type="url" placeholder="https://..."></label><label>التصنيف<input id="category" maxlength="100"></label><label>الترتيب<input id="order" type="number" min="0" step="1" value="0"></label><label><input id="active" type="checkbox" checked> مفعّل</label><div class="actions"><button class="button primary" type="submit">حفظ</button><button class="button" type="button" id="cancel">إلغاء</button></div></form></dialog><script type="module" src="../js/admin/solutions.js"></script></body></html>
