<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>إدارة المصادر | مِنهَاج</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="container admin-page">
    <section class="page-head">
      <span class="eyebrow">لوحة الإدارة</span>
      <h1>إدارة المصادر</h1>
      <p class="muted">إدارة المصادر الموجودة في Firestore مع تحميل تدريجي وفلاتر.</p>
    </section>
    <section class="card">
      <div class="section-head"><h2>المصادر</h2><button class="button primary" id="add-resource">إضافة مصدر</button></div>
      <div class="filters" id="resource-filters">
        <input id="resource-search" type="search" placeholder="ابحث بالعنوان أو الكلمات المفتاحية" aria-label="البحث في المصادر">
        <select id="resource-branch" aria-label="الفرع"><option value="">كل الفروع</option></select>
        <select id="resource-subject" aria-label="المادة"><option value="">كل المواد</option></select>
        <select id="resource-category" aria-label="التصنيف"><option value="">كل التصنيفات</option></select>
        <select id="resource-type" aria-label="النوع"><option value="">كل الأنواع</option></select>
        <select id="resource-active" aria-label="الحالة"><option value="">كل الحالات</option><option value="true">مفعّل</option><option value="false">معطّل</option></select>
      </div>
      <div id="resource-list" class="grid" aria-live="polite"><div class="empty">جاري تحميل المصادر...</div></div>
      <div class="actions" id="resource-pagination"></div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script type="module" src="../js/admin/resources.js"></script>
</body>
</html>
