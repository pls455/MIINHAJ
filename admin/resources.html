<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة المصادر | مِنهَاج</title><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/responsive.css"><link rel="stylesheet" href="../css/admin.css"></head>
<body><header id="site-header"></header><main class="container admin-page">
<section class="page-head"><span class="eyebrow">لوحة الإدارة</span><h1>إدارة المصادر</h1><p class="muted">إدارة المصادر الموجودة في Firestore مع تحميل تدريجي وفلاتر.</p></section>
<section class="card"><div class="section-head"><h2>المصادر</h2><button class="button primary" id="add-resource">إضافة مصدر</button></div>
<div class="filters" id="resource-filters"><input id="resource-search" type="search" placeholder="ابحث بالعنوان أو الكلمات المفتاحية" aria-label="البحث في المصادر"><select id="resource-branch" aria-label="الفرع"><option value="">كل الفروع</option></select><select id="resource-subject" aria-label="المادة"><option value="">كل المواد</option></select><select id="resource-category" aria-label="التصنيف"><option value="">كل التصنيفات</option></select><select id="resource-type" aria-label="النوع"><option value="">كل الأنواع</option></select><select id="resource-active" aria-label="الحالة"><option value="">كل الحالات</option><option value="true">مفعّل</option><option value="false">معطّل</option></select></div>
<div id="resource-list" class="grid" aria-live="polite"><div class="empty">جاري تحميل المصادر...</div></div><div class="actions" id="resource-pagination"></div></section>
</main><div id="resource-modal" class="modal" hidden><div class="modal-backdrop" data-close-resource></div><section class="modal-content card" role="dialog" aria-modal="true" aria-labelledby="resource-modal-title"><div class="section-head"><h2 id="resource-modal-title">إضافة مصدر</h2><button type="button" class="button" data-close-resource>إغلاق</button></div><form id="resource-form"><input type="hidden" id="resource-id"><div class="form-grid"><label>العنوان<input id="form-title" required maxlength="200"></label><label>الرابط<input id="form-url" type="url" required maxlength="2000" placeholder="https://..."></label><label>النوع<input id="form-type" maxlength="80"></label><label>الترتيب<input id="form-order" type="number" min="0" step="1" value="0"></label><label>الفرع<select id="form-branches" multiple required></select></label><label>المادة<select id="form-subject" required><option value="">اختر المادة</option></select></label><label>التصنيف<select id="form-category"><option value="">بدون تصنيف</option></select></label><label>الكلمات المفتاحية<input id="form-keywords" placeholder="رياضيات، ملزمة، توجيهي"></label><label>الوسوم<input id="form-tags" placeholder="مهم، مراجعة"></label><label class="form-check"><input id="form-active" type="checkbox" checked> مفعّل</label><label class="full">الوصف<textarea id="form-description" rows="4" maxlength="2000"></textarea></label></div><div id="form-error" class="error-box" hidden></div><div class="actions"><button type="button" class="button" data-close-resource>إلغاء</button><button class="button primary" type="submit" id="save-resource">حفظ</button></div></form></section></div><footer id="site-footer"></footer><script type="module" src="../js/admin/resources.js"></script></body></html>
