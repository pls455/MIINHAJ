<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة مِنهَاج</title><meta name="description" content="لوحة إدارة مِنهَاج."><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/responsive.css"><link rel="stylesheet" href="../css/admin.css"></head><body data-page="admin"><div id="adminApp"></div><script type="module" src="../js/admin/index.js"></script><script type="module" src="../js/admin/fixes.js"></script><script>const addAdminLinks=()=>{const nav=document.getElementById('adminNav');if(!nav)return false;[['students.html','الطلاب المسجلون','data-students-link'],['schools.html','المدارس','data-schools-link'],['directorates.html','المديريات','data-directorates-link'],['templates.html','القوالب العامة','data-templates-link'],['tests.html','إدارة الاختبارات','data-tests-link']].reverse().forEach(([href,text,key])=>{if(nav.querySelector(`[${key}]`))return;const a=document.createElement('a');a.className='admin-nav';a.href=href;a.textContent=text;a.setAttribute(key,'1');nav.prepend(a)});return true};const timer=setInterval(()=>{if(addAdminLinks())clearInterval(timer)},100);setTimeout(()=>clearInterval(timer),10000);</script></body></html>
