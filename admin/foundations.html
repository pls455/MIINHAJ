<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة التأسيس | مِنهَاج"><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/responsive.css"><link rel="stylesheet" href="../css/admin.css"></head><body><header id="site-header"></header><main class="container admin-page"><section class="page-head"><span class="eyebrow">لوحة الإدارة</span><h1>إدارة التأسيس</h1></section><section class="card"><div class="section-head"><h2>المحتوى</h2><button class="button primary" id="add-foundation">إضافة تأسيس</button></div><div id="foundation-list" class="grid"><div class="empty">جاري التحميل...</div></div><div id="foundation-pagination" class="actions"></div></section></main><footer id="site-footer"></footer><dialog id="foundation-dialog"><form method="dialog" id="foundation-form" class="card"><h2 id="form-title">إضافة تأسيس</h2><label>العنوان<input id="title" required maxlength="200"></label><label>الوصف<textarea id="description" maxlength="2000"></textarea></label><label>الرابط<input id="url" type="url" placeholder="https://..."></label><label>النوع<input id="type" maxlength="80"></label><label>الترتيب<input id="order" type="number" min="0" step="1" value="0"></label><label><input id="active" type="checkbox" checked> مفعّل</label><div class="actions"><button class="button primary" type="submit">حفظ</button><button class="button" id="cancel" type="button">إلغاء</button></div></form></dialog><script type="module" src="../js/admin/foundations.js"></script></body></html>
